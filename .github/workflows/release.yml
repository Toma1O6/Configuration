name: Release
on:
  push:
    tags:
      - 'version/*'

env:
  JAVA_VENDOR: 'microsoft'
  JAVA_VERSION: '17'
  CURSEFORGE_PROJECT: '444699'
  MODRINTH_PROJECT: '3WjjSM5O'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, forge ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_VENDOR }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - run: ./gradlew :${{ matrix.loader }}:assemble
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.loader }}
          path: |
            ${{ matrix.loader }}/build/libs/*-${{ matrix.loader }}-*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
          retention-days: 1
          if-no-files-found: error

  prepare-changelog:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v7
      - uses: Toma1O6/file-read-action@v1
        id: changelog
        with:
          file: 'CHANGELOG.md'
          max-chars: '4096'

  publish-curseforge:
    runs-on: ubuntu-latest
    needs:
      - prepare-changelog
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, forge ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifact-${{ matrix.loader }}
          path: 'artifacts'
      - uses: T-T-Team/curseforge-publish-action@v2
        with:
          token: ${{ secrets.CF_TOKEN }}
          project-id: ${{ env.CURSEFORGE_PROJECT }}
          java-version: Java ${{ env.JAVA_VERSION }}
          changelog-content: ${{ needs.prepare-changelog.outputs.changelog }}
          debug-mode: ${{ vars.DEBUG }}

  publish-modrinth:
    runs-on: ubuntu-latest
    needs:
      - prepare-changelog
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, forge ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifact-${{ matrix.loader }}
          path: 'artifacts'
      - uses: T-T-Team/modrinth-publish-action@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project-id: ${{ env.MODRINTH_PROJECT }}
          changelog-content: ${{ needs.prepare-changelog.outputs.changelog }}
          debug-mode: ${{ vars.DEBUG }}